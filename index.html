<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tv-color-wash"></div><div class="tv-noise"></div><div class="tv-tracking"></div>
    <main class="page">
        <header class="brand">
            <div class="brand-sub">H0SS31N Presents</div>
            <h1>THE SIGNAL</h1>
            <p>PRESS PLAY. SURVIVE.</p>
        </header>

        <audio id="bg-music" loop preload="auto">
            <source src="music/the-signal-theme.mp3" type="audio/mpeg">
        </audio>
        <audio id="boss-music" loop preload="auto">
            <source src="music/boss-theme.mp3" type="audio/mpeg">
        </audio>

        <section class="game-wrap">
            <canvas id="game" width="900" height="700"></canvas>
            <div class="crt"></div>
            <div class="vignette"></div>
            <div class="noise"></div>

            <div id="start-screen" class="overlay">
                <div class="panel">
                    <div class="eyebrow">Welcome to</div>
                    <div class="ship-icon">🚀</div>
                    <h2>THE SIGNAL</h2>
                    <p>THE SIGNAL IS LIVE.<br>HOW LONG CAN YOU STAY IN?</p>
                    <div class="load-bar"><div id="load-fill"></div></div>
                    <p id="load-status" class="load-status">LOADING TRANSMISSION...</p>
                    <button id="start-btn" disabled>LOADING 0%</button>
                </div>
            </div>

            <div id="game-over" class="overlay hidden">
                <div class="panel">
                    <div class="eyebrow">SIGNAL LOST</div>
                    <h2>GAME OVER</h2>
                    <p>Score <strong id="final-score">0</strong></p>
                    <p>High Score <strong id="final-high-score">0</strong></p>
                    <button id="restart-btn">RE-ENTER</button>
                </div>
            </div>
        </section>

        <section class="controls">
            <div><span>MOVE</span> WASD / ARROWS</div>
            <div><span>FIRE</span> SPACE</div>
            <div><span>PAUSE</span> P</div>
            <div><span>MUSIC</span> M</div>
            <div><span>ALT MOVE</span> E</div>
        </section>

        <footer>The Signal • V0.1 • beta</footer>
    </main>

    <script src="game.js"></script>
</body>
</html>
